<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather App</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            margin: auto;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
        }

        input {
            padding: 10px;
            width: 80%;
            margin-bottom: 10px;
        }

        button {
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        .weather {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🌦️ Weather App</h2>
    
    <input type="text" id="city" placeholder="Enter city name">
    <br>
    <button onclick="getWeather()">Get Weather</button>

    <div class="weather" id="weatherResult"></div>
</div>

<script>
async function getWeather() {
    const city = document.getElementById("city").value;

    const url = `http://api.weatherapi.com/v1/current.json?key=36f8bdc2f6964416b5d170154262204&q=${city}&aqi=yes`;

    try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.error) {
            document.getElementById("weatherResult").innerHTML = "❌ City not found";
            return;
        }

        const result = `
            <h3>${data.location.name}, ${data.location.country}</h3>
            <p>🌡️ Temp: ${data.current.temp_c}°C</p>
            <p>🌥️ Condition: ${data.current.condition.text}</p>
            <img src="${data.current.condition.icon}">
        `;

        document.getElementById("weatherResult").innerHTML = result;

    } catch (error) {
        document.getElementById("weatherResult").innerHTML = "⚠️ Error fetching data";
    }
}
</script>

</body>
</html>
